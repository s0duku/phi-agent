model:
  name: gpt-5
  temperature: 1.0
  # max_tokens: 32768
  reasoning:
    enabled: true
    effort: high

provider:
  kind: openai_chat
  api_base: https://your-endpoint.example.com/v1
  # TLS certificate verification is disabled by default for compatibility with self-signed endpoints.
  # Set this to false when the endpoint uses a trusted certificate.
  tls_insecure: true
  api_key: your_api_key

runtime:
  # system: ""
  # max_steps: 1000000
  # context_tokens: 262144

executor:
  # tool_output_token_limit: 8192

tools: []

# Custom tools are advertised to the model with a JSON Schema definition.
# Uncomment and edit this example to add one:
# tools:
